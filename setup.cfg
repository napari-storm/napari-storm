[metadata]
name = napari-storm
version = 2.1.0
author = Lenny Reinkensmeier
author_email = lrein@live.de
description = A Napari plugin for visualizing single-molecule localization microscopy data.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/napari-storm/napari-storm
license = BSD-3-Clause
classifiers =
    Framework :: napari
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent
    License :: OSI Approved :: BSD License
project_urls =
    Bug Tracker = https://github.com/napari-storm/napari-storm/issues
    Documentation = https://github.com/napari-storm/napari-storm/tree/main/docs
    Source Code = https://github.com/napari-storm/napari-storm
    User Support = https://github.com/napari-storm/napari-storm/issues

[options]
packages = find:
package_dir =
    = src
# 3.10 rather than 3.9 because napari 0.6 dropped 3.9: on 3.9 the resolver
# quietly falls back to napari 0.5.6, which is a different generation of the
# API, not the same package one version older.
python_requires = >=3.10
include_package_data = True
install_requires =
    napari>=0.4,<0.8
    qtpy
    numpy
    pandas
    matplotlib
    imageio
    tifffile
    h5py
    vispy
    scikit-image
    scikit-learn
    pillow
    # Imspector >= 24.10 MINFLUX exports: scipy.io reads the .mat container
    # (scipy already arrives with scikit-image, but a reader may not rely on
    # another package's dependency), zarr the directory-shaped one.
    scipy
    # Pinned below 3.0 deliberately: Imspector writes its MINFLUX table as a
    # structured array, and zarr 3 refuses those outright -- "No Zarr data type
    # found that matches ..." -- for stores zarr 2 reads back fine.  Reading is
    # all this package does with zarr, so the newer major buys nothing.
    zarr<3

# Required for the src layout: without `where`, `find:` searches the project
# root, resolves to an empty package list, and the built wheel contains only
# distribution metadata.
[options.packages.find]
where = src
exclude =
    *._tests
    *._tests.*

[options.package_data]
napari_storm =
    napari.yaml
napari_storm.napari_particles =
    NOTICE

[options.extras_require]
# The core deliberately does not pin a Qt binding.  Install one of these, or
# bring your own via napari's own extras.
pyqt6 =
    napari[pyqt6]>=0.4,<0.8
pyside6 =
    PySide6
dev =
    # Formatting and linting run through pre-commit, which pins their versions
    # in .pre-commit-config.yaml.  black, flake8 and isort are deliberately not
    # listed again here: two places to pin a formatter is how the tree came to
    # be checked by one set of versions and written by another.
    pre-commit
    pytest
    pytest-cov
    pytest-qt
    napari[all]>=0.4,<0.8
    tox
    twine
    build

[options.entry_points]
napari.manifest =
    napari-storm = napari_storm:napari.yaml

# flake8 predates black and defaults to rules black deliberately breaks, so
# without this the two disagree about every file -- silently, until someone
# runs flake8.
[flake8]
max-line-length = 88
# E203 (whitespace before ':') and W503 (line break before a binary operator)
# are both styles black produces; E704 is how it formats stubs and overloads.
#
# E501 as well, because black already enforces this limit on everything it is
# allowed to rewrite.  What reaches flake8 over the limit is the remainder:
# comments, docstrings, string literals and URLs, which black leaves alone on
# purpose and which flake8 can only complain about rather than fix.
extend-ignore = E203, E501, E704, W503
exclude =
    .git,
    __pycache__,
    .tox,
    .eggs,
    build,
    dist
per-file-ignores =
    # A re-export is an unused import by construction.
    src/napari_storm/localization_dataset_types/__init__.py:F401
    src/napari_storm/core/__init__.py:F401
    src/napari_storm/__init__.py:F401
    src/napari_storm/ns_constants.py:F401
    # Qt's own idiom, and the one file in the tree that follows it: this
    # module does `from qtpy.QtWidgets import *` and every Qt name it uses
    # then reads as "may be undefined".
    src/napari_storm/pyqt/detachable_tab.py:F401,F403,F405

[isort]
# black and isort disagree about wrapped imports unless told not to: the tree
# used isort's grid-grouped style, which black then re-explodes on every run.
# `profile = black` is the standard settlement, and issue #10 asked for black.
profile = black
line_length = 88
