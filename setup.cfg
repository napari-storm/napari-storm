[metadata]
name = napari-storm
version = 2.0.0
author = Lenny Reinkensmeier
author_email = lrein@live.de
description = A Napari plugin for visualizing single-molecule localization microscopy data.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/napari-storm/napari-storm
license = BSD-3-Clause
classifiers =
    Framework :: napari
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent
    License :: OSI Approved :: BSD License

[options]
packages = find:
package_dir =
    = src
# 3.10 rather than 3.9 because napari 0.6 dropped 3.9: on 3.9 the resolver
# quietly falls back to napari 0.5.6, which is a different generation of the
# API, not the same package one version older.
python_requires = >=3.10
include_package_data = True
install_requires =
    napari>=0.4,<0.8
    qtpy
    numpy
    pandas
    matplotlib
    imageio
    tifffile
    h5py
    vispy
    scikit-image
    scikit-learn
    pillow

# Required for the src layout: without `where`, `find:` searches the project
# root, resolves to an empty package list, and the built wheel contains only
# distribution metadata.
[options.packages.find]
where = src
exclude =
    *._tests
    *._tests.*

[options.package_data]
napari_storm =
    napari.yaml
napari_storm.napari_particles =
    NOTICE

[options.extras_require]
# The core deliberately does not pin a Qt binding.  Install one of these, or
# bring your own via napari's own extras.
pyqt6 =
    napari[pyqt6]>=0.4,<0.8
pyside6 =
    PySide6
dev =
    black
    flake8
    pytest
    pytest-cov
    pytest-qt
    napari[all]>=0.4,<0.8
    tox
    twine
    build
    isort

[options.entry_points]
napari.manifest =
    napari-storm = napari_storm:napari.yaml
