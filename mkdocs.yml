site_name: napari-storm
site_description: >-
  Interactive visualization of single-molecule localization microscopy data
  (STORM, PALM, MINFLUX) in napari.
site_url: https://napari-storm.readthedocs.io/
repo_url: https://github.com/napari-storm/napari-storm
repo_name: napari-storm/napari-storm
edit_uri: edit/main/docs/

extra_css:
  - res/extra.css

theme:
  name: material
  logo: res/napari_storm_logo_small.png
  favicon: res/napari_storm_logo_small.png

  # res/extra.css defines the brand colours for both the default scheme and
  # `slate`.  Without this toggle the slate half of that file is unreachable.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Importing data: importing.md
      - Rendering and contrast: rendering.md
      - Rendering styles: styles.md
      - Navigating in 2-D and 3-D: navigating.md
      - Filtering and adjusting: filtering.md
      - MINFLUX: minflux.md
      - Export and scenes: export.md
  - Reference:
      - Every control: controls.md
      - Troubleshooting: troubleshooting.md
      - Changelog: changelog.md
  - For developers:
      - How it works: how-it-works.md
      - Embedding: embedding.md
      - API reference: api.md

# The old single-page tutorial, now split across the user guide.  Kept so
# links to it still land somewhere useful.
not_in_nav: |
  /step-by-step.md

# mkdocstrings was configured here for a long time without a single `:::`
# directive in docs/ to invoke it.  It rendered nothing, it made napari, Qt and
# VisPy build-time dependencies of the documentation, and its `setup_commands`
# option was removed upstream -- so the build failed outright on any current
# version.  docs/api.md is written by hand and is the better page for it.

watch:
  - src/napari_storm

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.keys
  - def_list
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true
