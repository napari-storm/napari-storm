# Read the Docs build configuration.
#
# Required: without a v2 config file in the repository root, Read the Docs
# refuses the build outright rather than falling back to a default.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  # The docs build does not import napari-storm -- there is no autodoc -- so
  # every warning is a real one: a broken link, a missing page, an asset that
  # moved.  Failing on them keeps the published site honest.
  fail_on_warning: true

python:
  install:
    # The documentation toolchain only.  The package itself is deliberately
    # not installed: nothing in docs/ imports it, and installing napari and a
    # Qt binding on a docs builder buys a slower build and more ways to fail.
    - requirements: docs/requirements.txt
