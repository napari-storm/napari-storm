# For more information about tox, see https://tox.readthedocs.io/en/latest/
#
# The matrix here must stay in step with .github/workflows/ci.yml and with
# python_requires in setup.cfg.  It previously declared py37-py39 while the
# package metadata said >=3.8.  py39 is gone because napari 0.6 dropped it.
[tox]
envlist = py{310,311,312}-{linux,macos,windows}
isolated_build = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
extras =
    dev
    pyqt6
commands = pytest -v --color=yes --cov=napari_storm --cov-report=xml
